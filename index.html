// NumInput: botones +/- Y toque sobre el número para escribirlo directo
const NumInput=({value,onChange,step=1,disabled,decimals=false})=>{
  const[editing,setEditing]=useState(false);
  const[tmp,setTmp]=useState('');
  const round=n=>decimals?Math.round(n*10)/10:Math.round(n);
  const commit=()=>{
    const n=parseFloat(String(tmp).replace(',','.'));
    if(!isNaN(n))onChange(Math.max(0,round(n)));
    setEditing(false);
  };
  const btn={width:26,height:26,borderRadius:6,background:T.bg3,border:`1px solid ${T.border}`,cursor:disabled?'not-allowed':'pointer',color:disabled?T.textMuted:T.textSub,display:'flex',alignItems:'center',justifyContent:'center',padding:0,flexShrink:0};
  return(
    <div style={{display:'flex',alignItems:'center',gap:4}}>
      <button disabled={disabled} onClick={()=>onChange(Math.max(0,round(value-step)))} style={btn}><Icon.minus/></button>
      {editing&&!disabled?(
        <input
          type="number" inputMode="decimal" autoFocus
          value={tmp}
          onChange={e=>setTmp(e.target.value)}
          onBlur={commit}
          onKeyDown={e=>{if(e.key==='Enter'){e.target.blur();}}}
          style={{width:46,fontSize:14,fontFamily:T.mono,color:T.text,textAlign:'center',background:T.bg0,border:`1px solid ${T.accent}`,borderRadius:6,padding:'3px 2px',outline:'none'}}
        />
      ):(
        <span
          onClick={()=>{if(!disabled){setTmp(String(value));setEditing(true);}}}
          style={{fontSize:14,fontFamily:T.mono,color:disabled?T.textMuted:T.text,minWidth:46,textAlign:'center',cursor:disabled?'default':'text',borderBottom:disabled?'none':`1px dashed ${T.border}`,padding:'2px 0'}}
        >{value}</span>
      )}
      <button disabled={disabled} onClick={()=>onChange(round(value+step))} style={btn}><Icon.plus/></button>
    </div>
  );
};

// Limpia entrenamientos activos de hace más de 18 horas (probable que se olvidaran)
function cleanStaleActive(){
  const a=S.get(S.ACTIVE);
  if(a&&a.startTime&&(Date.now()-a.startTime>18*60*60*1000)){
    S.set(S.ACTIVE,null);return null;
  }
  return a;
}

// ─── DAILY GOALS (Mifflin-St Jeor + objetivo) ─────────────────────────────────
function calcDailyGoals(profile,sex='male'){
  const w=parseFloat(profile.weight)||75;
  const h=parseFloat(profile.height)||175;
  const a=parseFloat(profile.age)||28;
  const bmr=10*w+6.25*h-5*a+(sex==='male'?5:-161);
  const days=parseFloat(profile.daysPerWeek)||4;
  const activity=days<=2?1.375:days<=4?1.55:days<=5?1.65:1.75;
  const tdee=bmr*activity;
  const adj=profile.goal==='hypertrophy'?300:profile.goal==='strength'?200:profile.goal==='endurance'?-150:profile.goal==='hybrid'?100:0;
  const kcal=Math.round((tdee+adj)/10)*10;
  const proteinPerKg=profile.goal==='hypertrophy'?2.0:profile.goal==='endurance'?1.4:1.8;
  const protein=Math.round(w*proteinPerKg);
  const water=Math.round(w*0.035*10)/10;
  return{kcal,protein,water,bmr:Math.round(bmr),tdee:Math.round(tdee),sleepMin:7,sleepMax:9};
}

// Procesa imagen con bajo uso de memoria usando createImageBitmap (fallback a Image si no existe)
async function imageToBase64(file,maxSize=720){
  let bitmap=null,resized=null,canvas=null;
  try{
    if(typeof createImageBitmap==='function'){
      bitmap=await createImageBitmap(file);
      let w=bitmap.width,h=bitmap.height;
      if(w>maxSize||h>maxSize){
        if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}
        else{w=Math.round(w*maxSize/h);h=maxSize;}
        try{
          resized=await createImageBitmap(bitmap,{resizeWidth:w,resizeHeight:h,resizeQuality:'high'});
          bitmap.close();bitmap=null;
        }catch{
          // Si createImageBitmap con resize no es soportado (Safari viejo), seguimos con bitmap original
          resized=bitmap;bitmap=null;
        }
      }else{resized=bitmap;bitmap=null;}
      canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(resized,0,0,w,h);
      resized.close&&resized.close();resized=null;
      const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.72));
      canvas=null; // libera referencia
      const dataUrl=await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result);
        r.onerror=()=>rej(new Error('read'));
        r.readAsDataURL(blob);
      });
      return{base64:dataUrl.split(',')[1],dataUrl};
    }
    // Fallback (Image + canvas)
    return await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onerror=()=>reject(new Error('read'));
      reader.onload=e=>{
        const img=new Image();
        img.onerror=()=>reject(new Error('img'));
        img.onload=()=>{
          let w=img.width,h=img.height;
          if(w>maxSize||h>maxSize){
            if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}
            else{w=Math.round(w*maxSize/h);h=maxSize;}
          }
          const c=document.createElement('canvas');
          c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          const dataUrl=c.toDataURL('image/jpeg',0.72);
          img.src='';
          resolve({base64:dataUrl.split(',')[1],dataUrl});
        };
        img.src=e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }finally{
    if(bitmap&&bitmap.close)bitmap.close();
    if(resized&&resized.close)resized.close();
  }
}
function lastNDates(n){
  return Array.from({length:n},(_, i)=>{
    const d=new Date();d.setDate(d.getDate()-(n-1-i));
    return d.toISOString().slice(0,10);
  });
}

function registerCustomExercise({name,category,muscle}){
  const id='custom_'+Date.now().toString(36);
  const ex={
    id,name:name.trim(),category,
    muscles:muscle&&muscle.trim()?muscle.split(',').map(m=>m.trim()).filter(Boolean):['Personalizado'],
    equipment:[],difficulty:'intermediate',evidence:'—',custom:true,
    description:'Ejercicio personalizado añadido por ti.',
    cues:[],alternatives:[],steps:[],
    videoQuery:name.trim(),
  };
  DB.exercises[id]=ex;
  try{
    const all=JSON.parse(localStorage.getItem('gt_custom')||'{}');
    all[id]=ex;
    localStorage.setItem('gt_custom',JSON.stringify(all));
  }catch(e){}
  return ex;
}

// Variantes que trabajan el MISMO músculo (comparten al menos un músculo); alternativas curadas primero
function sameMuscleVariants(exercise){
  const myMuscles=new Set((exercise.muscles||[]).map(m=>m.toLowerCase()));
  const altIds=new Set(exercise.alternatives||[]);
  return Object.values(DB.exercises)
    .filter(e=>e.id!==exercise.id)
    .map(e=>{
      const shared=(e.muscles||[]).filter(m=>myMuscles.has(m.toLowerCase())).length;
      return{e,shared,isAlt:altIds.has(e.id)};
    })
    .filter(x=>x.shared>0||x.isAlt)
    .sort((a,b)=>(b.isAlt-a.isAlt)||(b.shared-a.shared))
    .map(x=>x.e);
}

// ─── PROGRESS DATA HELPERS ────────────────────────────────────────────────────
const isCardioId=id=>DB.exercises[id]?.category==='cardio';

function calcPRs(sessions){
  const prs={};
  sessions.forEach(session=>{
    (session.exercises||[]).forEach(ex=>{
      if(isCardioId(ex.id))return; // cardio no tiene PR de peso
      (ex.sets||[]).forEach(set=>{
        if(set.done&&set.weight>0&&set.reps>0){
          const est1rm=set.weight*(1+set.reps/30);
          if(!prs[ex.id]||est1rm>prs[ex.id].est1rm){
            prs[ex.id]={weight:set.weight,reps:set.reps,est1rm,date:session.date};
          }
        }
      });
    });
  });
  return prs;
}

function calcWeeklyVolume(sessions){
  const byWeek={};
  sessions.forEach(s=>{
    const d=new Date(s.date);
    const mon=new Date(d);mon.setDate(d.getDate()-d.getDay()+1);
    const key=mon.toISOString().slice(0,10);
    const vol=(s.exercises||[]).filter(e=>!isCardioId(e.id)).flatMap(e=>e.sets||[]).filter(st=>st.done).reduce((a,st)=>a+st.weight*st.reps,0);
    byWeek[key]=(byWeek[key]||0)+vol;
  });
  return byWeek;
}

// Stats globales acumuladas desde el inicio
function calcGlobalStats(sessions){
  let maxW=0,maxWex='',maxWdate='',totalVol=0,totalKm=0,totalMin=0;
  sessions.forEach(s=>{
    (s.exercises||[]).forEach(ex=>{
      const cardio=isCardioId(ex.id);
      (ex.sets||[]).forEach(st=>{
        if(!st.done)return;
        if(cardio){totalKm+=(st.weight||0);totalMin+=(st.reps||0);}
        else{
          if((st.weight||0)>maxW){maxW=st.weight;maxWex=DB.exercises[ex.id]?.name||ex.id;maxWdate=s.date;}
          totalVol+=(st.weight||0)*(st.reps||0);
        }
      });
    });
  });
  return{maxW,maxWex,maxWdate,totalVol:Math.round(totalVol),totalKm:Math.round(totalKm*10)/10,totalMin,count:sessions.length};
}

// Máximo de la sesión anterior para un ejercicio (referencia "¿cuánto cargué la última vez?")
function lastSessionMax(sessions,exId){
  const sorted=[...sessions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  for(const s of sorted){
    const ex=(s.exercises||[]).find(e=>e.id===exId);
    if(!ex)continue;
    const done=(ex.sets||[]).filter(st=>st.done);
    if(!done.length)continue;
    if(isCardioId(exId)){
      const dist=Math.max(0,...done.map(st=>st.weight||0));
      const time=Math.max(0,...done.map(st=>st.reps||0));
      if(dist>0||time>0)return{cardio:true,dist,time,date:s.date};
    }else{
      const weighted=done.filter(st=>st.weight>0);
      if(!weighted.length)continue;
      const top=weighted.reduce((a,st)=>st.weight>a.weight?st:a,weighted[0]);
      return{cardio:false,weight:top.weight,reps:top.reps,date:s.date};
    }
  }
  return null;
}
function daysAgoLabel(dateStr){
  const d=Math.floor((Date.now()-new Date(dateStr))/(1000*60*60*24));
  if(d<=0)return'hoy';
  if(d===1)return'ayer';
  if(d<7)return`hace ${d} días`;
  const w=Math.floor(d/7);
  return w===1?'hace 1 sem':`hace ${w} sem`;
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
const DashboardScreen=({profile,plan,sessions,onStartWorkout,onUpdatePlan})=>{
  const today=new Date();
  const todayName=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][today.getDay()];
  const[activeDay,setActiveDay]=useState(()=>{
    const idx=plan.days.findIndex(d=>d.day===todayName);
    return idx>=0?idx:0;
  });
  const selectedDay=plan.days[activeDay];
  const streak=useMemo(()=>{
    if(!sessions.length)return 0;
    const dates=[...new Set(sessions.map(s=>s.date.slice(0,10)))].sort().reverse();
    let count=0;const today=new Date();
    for(let i=0;i<dates.length;i++){
      const diff=Math.floor((today-new Date(dates[i]))/(1000*60*60*24));
      if(diff===i||diff===i+1){count++;}else break;
    }
    return count;
  },[sessions]);

  const weekSessions=sessions.filter(s=>{
    const d=new Date(s.date);const now=new Date();
    const weekStart=new Date(now);weekStart.setDate(now.getDate()-now.getDay()+1);
    return d>=weekStart;
  });

  const[editMode,setEditMode]=useState(false);
  const[showAdd,setShowAdd]=useState(false);

  const deleteExercise=(exIdx)=>{
    if(!onUpdatePlan)return;
    const newPlan={...plan,days:plan.days.map((d,i)=>i===activeDay?{...d,exercises:d.exercises.filter((_,j)=>j!==exIdx)}:d)};
    onUpdatePlan(newPlan);
  };
  const addExerciseToDay=(newEx)=>{
    if(!onUpdatePlan)return;
    const newPlan={...plan,days:plan.days.map((d,i)=>i===activeDay?{...d,exercises:[...d.exercises,newEx]}:d)};
    onUpdatePlan(newPlan);
    setShowAdd(false);
  };

  return(
    <div style={{height:'100%',overflowY:'auto',background:T.bg0}}>
      <div style={{padding:'18px 20px 0'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono,letterSpacing:'0.05em',textTransform:'uppercase'}}>Buenos días</div>
            <h1 style={{fontSize:26,color:T.text,margin:'3px 0 0',fontWeight:700,letterSpacing:'-0.02em'}}>{profile.name||'Atleta'}</h1>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6,background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:'8px 12px'}}>
            <Icon.fire/><span style={{fontSize:16,fontWeight:700,fontFamily:T.mono,color:T.accent}}>{streak}</span><span style={{fontSize:10,color:T.textMuted}}>días</span>
          </div>
        </div>
        <div style={{display:'flex',gap:8,marginTop:14}}>
          {[{l:'Semana',v:`${weekSessions.length}/${plan.days.length}`,u:'sesiones'},{l:'Peso',v:profile.weight,u:'kg'},{l:'Racha',v:streak,u:'días'}].map((s,i)=>(

                    <div style={{color:T.textMuted,fontSize:12}}>{ex.sets} × {ex.reps}</div>
                  </div>
                  {editMode?(
                    <button onClick={()=>deleteExercise(i)} style={{background:T.red+'18',border:`1px solid ${T.red}44`,borderRadius:8,width:32,height:32,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:T.red,flexShrink:0}}><Icon.x/></button>

            {editMode&&(
              <button onClick={()=>setShowAdd(true)} style={{background:'none',border:`1.5px dashed ${T.accent}66`,borderRadius:10,padding:'12px',cursor:'pointer',color:T.accent,fontSize:13,fontWeight:700,fontFamily:T.font,display:'flex',alignItems:'center',justifyContent:'center',gap:6,marginTop:4}}>
                <span style={{fontSize:18,lineHeight:1}}>+</span> Añadir ejercicio

      )}
      <div style={{height:20}}/>
      {showAdd&&<ExercisePickerModal onClose={()=>setShowAdd(false)} onAdd={addExerciseToDay} dayLabel={selectedDay?.label||''}/>}

  );
};

// ─── SWAP MODAL ───────────────────────────────────────────────────────────────
const SwapModal=({exercise,onClose,onSwap})=>{
  const[query,setQuery]=useState('');
  const altIds=new Set(exercise.alternatives||[]);
  const myMuscles=new Set((exercise.muscles||[]).map(m=>m.toLowerCase()));
  const sharesMuscle=e=>(e.muscles||[]).some(m=>myMuscles.has(m.toLowerCase()));
  // Base: variantes que trabajan el MISMO músculo (curadas primero); luego el resto de la misma categoría
  const variants=sameMuscleVariants(exercise);
  const variantIds=new Set(variants.map(e=>e.id));
  const sameCatExtra=Object.values(DB.exercises).filter(e=>e.id!==exercise.id&&e.category===exercise.category&&!variantIds.has(e.id));
  const pool=[...variants,...sameCatExtra];
  const sorted=query?pool.filter(e=>e.name.toLowerCase().includes(query.toLowerCase())):pool;

  return(
    <div style={{position:'absolute',inset:0,background:T.bg0+'f0',zIndex:200,display:'flex',flexDirection:'column',animation:'slideUp .2s ease'}}>
      <div style={{padding:'16px 20px',borderBottom:`1px solid ${T.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono}}>Reemplazar</div>
          <div style={{fontSize:16,fontWeight:700,color:T.text,marginTop:2}}>{exercise.name}</div>
        </div>
        <button onClick={onClose} style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:8,width:34,height:34,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:T.textSub}}><Icon.x/></button>
      </div>
      <div style={{padding:'12px 20px 8px'}}>
        <input placeholder="Buscar ejercicio..." value={query} onChange={e=>setQuery(e.target.value)} style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:'11px 16px',color:T.text,fontSize:14,fontFamily:T.font,outline:'none',width:'100%',boxSizing:'border-box'}}/>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'4px 20px 20px'}}>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {sorted.map(exData=>(
            <div key={exData.id} style={{background:T.bg2,border:`1px solid ${altIds.has(exData.id)?T.accent+'66':T.border}`,borderRadius:10,padding:'12px 14px',display:'flex',gap:12,alignItems:'flex-start'}}>
              <div style={{flex:1}}>
                <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:3,flexWrap:'wrap'}}>
                  <span style={{fontSize:14,fontWeight:700,color:T.text}}>{exData.name}</span>
                  <Badge color={exData.evidence==='A'?T.green:T.blue}>Ev. {exData.evidence}</Badge>
                  {altIds.has(exData.id)&&<Badge color={T.accent}>Recomendado</Badge>}
                  {!altIds.has(exData.id)&&sharesMuscle(exData)&&<Badge color={T.green}>Mismo músculo</Badge>}
                </div>
                <div style={{fontSize:11,color:T.textMuted}}>{exData.muscles.slice(0,2).join(', ')}</div>
              </div>
              <button onClick={()=>onSwap(exData)} style={{flexShrink:0,background:T.accent+'18',border:`1px solid ${T.accent}44`,borderRadius:8,padding:'8px 12px',color:T.accent,cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:T.font}}>Elegir</button>
            </div>
          ))}
          {sorted.length===0&&<div style={{color:T.textMuted,fontSize:13,textAlign:'center',padding:24}}>Sin resultados para "{query}"</div>}
        </div>
      </div>
    </div>
  );
};

// ─── WORKOUT SCREEN ───────────────────────────────────────────────────────────
const WorkoutScreen=({workout,profile,apiKey,sessions=[],onFinish,savedState})=>{
  const initial=savedState&&savedState.workout?savedState:null;
  const[currentIdx,setCurrentIdx]=useState(initial?.currentIdx||0);
  const[exercises,setExercises]=useState(()=>initial?.exercises||workout.exercises.map(ex=>({...ex})));
  const[sets,setSets]=useState(()=>initial?.sets||workout.exercises.map(ex=>{
    const cardio=isCardioId(ex.id);
    return Array.from({length:ex.sets},(_, i)=>({setNum:i+1,reps:cardio?0:(parseInt(ex.reps)||8),weight:0,done:false}));
  }));
  const startTimeRef=useRef(initial?.startTime||Date.now());
  const restEndRef=useRef(initial?.restEndTime&&initial.restEndTime>Date.now()?initial.restEndTime:0);
  const restTotalRef=useRef(initial?.restTotal||0);
  const[restActive,setRestActive]=useState(restEndRef.current>0);
  const[restTime,setRestTime]=useState(()=>restEndRef.current>0?Math.max(0,Math.ceil((restEndRef.current-Date.now())/1000)):0);
  const[elapsed,setElapsed]=useState(()=>Math.floor((Date.now()-startTimeRef.current)/1000));
  const[showSwap,setShowSwap]=useState(false);

  const currentEx=exercises[currentIdx];
  const currentExData=DB.exercises[currentEx?.id];
  const currentSets=sets[currentIdx];
  const isCardio=currentExData?.category==='cardio';

  // Timer del entreno basado en timestamp — preciso tras reload
  useEffect(()=>{
    const update=()=>setElapsed(Math.floor((Date.now()-startTimeRef.current)/1000));
    update();
    const t=setInterval(update,1000);
    return()=>clearInterval(t);
  },[]);

  // Timer de descanso basado en timestamp
  useEffect(()=>{
    if(!restActive)return;
    const update=()=>{
      const rem=Math.max(0,Math.ceil((restEndRef.current-Date.now())/1000));
      setRestTime(rem);
      if(rem<=0){setRestActive(false);restEndRef.current=0;}
    };
    update();
    const t=setInterval(update,250);
    return()=>clearInterval(t);
  },[restActive]);

  // Auto-guarda estado del entrenamiento en localStorage en cada cambio
  useEffect(()=>{
    S.set(S.ACTIVE,{
      workout,
      exercises,
      sets,
      currentIdx,
      startTime:startTimeRef.current,
      restEndTime:restActive?restEndRef.current:0,
      restTotal:restTotalRef.current,
      lastUpdate:Date.now(),
    });
  },[exercises,sets,currentIdx,restActive,workout]);

  // Guarda también cuando se va al fondo (cierre app, cambio de pestaña)
  useEffect(()=>{
    const onVis=()=>{
      if(document.visibilityState==='hidden'){
        S.set(S.ACTIVE,{workout,exercises,sets,currentIdx,startTime:startTimeRef.current,restEndTime:restActive?restEndRef.current:0,restTotal:restTotalRef.current,lastUpdate:Date.now()});
      }
    };
    document.addEventListener('visibilitychange',onVis);
    return()=>document.removeEventListener('visibilitychange',onVis);
  },[exercises,sets,currentIdx,restActive,workout]);

  const updateSet=(ei,si,field,value)=>setSets(prev=>prev.map((es,e)=>e===ei?es.map((s,i)=>i===si?{...s,[field]:value}:s):es));
  const markDone=(ei,si)=>{
    updateSet(ei,si,'done',true);
    const rest=exercises[ei].rest;
    if(rest>0){
      restEndRef.current=Date.now()+rest*1000;
      restTotalRef.current=rest;
      setRestTime(rest);
      setRestActive(true);
    }
  };
  const skipRest=()=>{restEndRef.current=0;setRestActive(false);setRestTime(0);};

  const handleSwap=(newEx)=>{
    setExercises(prev=>prev.map((ex,i)=>i===currentIdx?{...ex,id:newEx.id}:ex));
    setShowSwap(false);
  };

  const totalDone=sets.flat().filter(s=>s.done).length;
  const totalSets=sets.flat().length;
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const restTotal=restTotalRef.current||1;

  const handleFinish=()=>{
    const sessionExercises=exercises.map((ex,ei)=>({id:ex.id,name:DB.exercises[ex.id]?.name||ex.id,sets:sets[ei]}));
    S.set(S.ACTIVE,null);
    onFinish({exercises:sessionExercises,duration:elapsed,workoutLabel:workout.label});
  };

  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.bg0,position:'relative'}}>
      <div style={{padding:'14px 20px',borderBottom:`1px solid ${T.border}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase',letterSpacing:'0.05em'}}>En progreso</div>
            <div style={{color:T.text,fontSize:15,fontWeight:700,marginTop:2}}>{workout.label}</div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:8,padding:'5px 10px',fontFamily:T.mono,fontSize:13,color:T.accent}}>{fmt(elapsed)}</div>
            <button onClick={handleFinish} style={{background:T.red+'18',border:`1px solid ${T.red}44`,borderRadius:8,padding:'5px 12px',color:T.red,fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:T.font}}>Fin</button>
          </div>
        </div>
        <div style={{marginTop:8}}>
          <ProgressBar value={totalDone} max={totalSets}/>
          <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono,marginTop:3}}>{totalDone}/{totalSets} series completadas</div>
        </div>
      </div>

      {restActive&&(
        <div style={{position:'absolute',inset:0,background:T.bg0+'ee',zIndex:100,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:20}}>
          <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase',letterSpacing:'0.1em'}}>Tiempo de descanso</div>
          <div style={{position:'relative',width:120,height:120}}>
            <svg width="120" height="120" style={{position:'absolute',transform:'rotate(-90deg)'}}>
              <circle cx="60" cy="60" r="54" fill="none" stroke={T.bg3} strokeWidth="6"/>
              <circle cx="60" cy="60" r="54" fill="none" stroke={T.accent} strokeWidth="6" strokeDasharray={`${2*Math.PI*54}`} strokeDashoffset={`${2*Math.PI*54*(1-restTime/restTotal)}`} style={{transition:'stroke-dashoffset 1s linear'}}/>
            </svg>
            <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
              <span style={{fontSize:34,fontWeight:700,fontFamily:T.mono,color:T.text}}>{restTime}</span>
              <span style={{fontSize:10,color:T.textMuted}}>seg</span>
            </div>
          </div>
          <button onClick={skipRest} style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:'10px 24px',color:T.textSub,cursor:'pointer',fontFamily:T.font,fontSize:14}}>Saltar descanso</button>
        </div>
      )}

      <div style={{display:'flex',borderBottom:`1px solid ${T.border}`,overflowX:'auto'}}>
        {exercises.map((ex,i)=>{
          const allDone=sets[i].every(s=>s.done);
          const exData=DB.exercises[ex.id];
          return(
            <button key={i} onClick={()=>setCurrentIdx(i)} style={{flexShrink:0,padding:'9px 14px',background:'transparent',border:'none',borderBottom:`2px solid ${i===currentIdx?T.accent:'transparent'}`,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
              <div style={{width:7,height:7,borderRadius:'50%',background:allDone?T.green:i===currentIdx?T.accent:T.border}}/>
              <span style={{fontSize:9,color:i===currentIdx?T.accent:T.textMuted,fontFamily:T.mono,whiteSpace:'nowrap'}}>{(exData?.name||'?').split(' ')[0]}</span>
            </button>
          );
        })}
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'14px 20px'}}>
        {currentExData&&(
          <>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
              <div style={{flex:1,minWidth:0}}>
                <h2 style={{color:T.text,fontSize:19,margin:'0 0 5px',fontWeight:700}}>{currentExData.name}</h2>
                <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                  {currentExData.muscles.slice(0,2).map((m,i)=><Badge key={i} color={T.textMuted} style={{borderColor:T.border}}>{m}</Badge>)}
                  <Badge color={currentExData.evidence==='A'?T.green:T.blue}>Evidencia {currentExData.evidence}</Badge>
                </div>
              </div>
              <button onClick={()=>setShowSwap(true)} style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:8,padding:'6px 10px',cursor:'pointer',color:T.textSub,display:'flex',alignItems:'center',gap:5,fontSize:12,fontFamily:T.font,flexShrink:0,marginLeft:10}}>
                <Icon.swap/> Cambiar
              </button>
            </div>
            <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:'11px 14px',marginBottom:10}}>
              <div style={{fontSize:12,color:T.textSub,lineHeight:1.6,marginBottom:7}}>{currentExData.description}</div>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                {currentExData.cues.map((cue,i)=>(
                  <div key={i} style={{display:'flex',gap:8,alignItems:'flex-start'}}>
                    <div style={{width:4,height:4,borderRadius:'50%',background:T.accent,marginTop:6,flexShrink:0}}/>
                    <span style={{fontSize:12,color:T.textMuted}}>{cue}</span>
                  </div>
                ))}
              </div>
            </div>
            <DemoPanel exercise={currentExData}/>
            <LastWeightBar sessions={sessions} exId={currentEx.id} currentSets={currentSets}/>
            <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,overflow:'hidden',marginBottom:14}}>
              <div style={{display:'grid',gridTemplateColumns:'38px 1fr 1fr 80px',padding:'9px 14px',borderBottom:`1px solid ${T.border}`}}>
                {['SET',isCardio?'DIST (km)':'PESO (kg)',isCardio?'TIEMPO (min)':'REPS',''].map((h,i)=><span key={i} style={{fontSize:9,color:T.textMuted,fontFamily:T.mono,letterSpacing:'0.05em',textAlign:i===3?'right':'left'}}>{h}</span>)}
              </div>
              {currentSets.map((s,si)=>(
                <div key={si} style={{display:'grid',gridTemplateColumns:'38px 1fr 1fr 80px',padding:'10px 14px',borderBottom:si<currentSets.length-1?`1px solid ${T.border}`:'none',background:s.done?T.green+'08':'transparent',transition:'background .3s',alignItems:'center'}}>
                  <span style={{fontSize:14,fontFamily:T.mono,color:s.done?T.green:T.textSub,fontWeight:700}}>{si+1}</span>
                  <NumInput value={s.weight} onChange={v=>updateSet(currentIdx,si,'weight',v)} step={isCardio?0.5:2.5} decimals={isCardio} disabled={s.done}/>
                  <NumInput value={s.reps} onChange={v=>updateSet(currentIdx,si,'reps',v)} step={isCardio?5:1} disabled={s.done}/>
                  <div style={{display:'flex',justifyContent:'flex-end'}}>
                    {s.done?(
                      <div style={{color:T.green,display:'flex',alignItems:'center',gap:4}}><Icon.check/><span style={{fontSize:11,fontFamily:T.mono}}>Hecho</span></div>
                    ):(
                      <button onClick={()=>markDone(currentIdx,si)} style={{background:T.accent+'20',border:`1px solid ${T.accent}44`,borderRadius:8,padding:'6px 12px',color:T.accent,cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:T.font}}>✓ Listo</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
            {currentIdx<exercises.length-1&&(
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:'11px 14px'}}>
                <div>
                  <div style={{fontSize:9,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase'}}>Siguiente</div>
                  <div style={{fontSize:14,color:T.text,fontWeight:600,marginTop:2}}>{DB.exercises[exercises[currentIdx+1].id]?.name}</div>
                </div>
                <button onClick={()=>setCurrentIdx(i=>i+1)} style={{background:T.bg3,border:`1px solid ${T.border}`,borderRadius:8,padding:'8px 14px',cursor:'pointer',color:T.textSub,fontSize:13,fontFamily:T.font}}>→</button>
              </div>
            )}
          </>
        )}
      </div>
      {showSwap&&currentExData&&(
        <SwapModal exercise={currentExData} onClose={()=>setShowSwap(false)} onSwap={handleSwap}/>
      )}
    </div>
  );
};

// ─── WORKOUT DONE ─────────────────────────────────────────────────────────────
const WorkoutDoneScreen=({session,onClose})=>{
  const totalSets=session.exercises.flatMap(e=>e.sets).filter(s=>s.done).length;
  const totalVolume=session.exercises.filter(e=>!isCardioId(e.id)).flatMap(e=>e.sets).filter(s=>s.done).reduce((a,s)=>a+s.weight*s.reps,0);
  const totalKm=session.exercises.filter(e=>isCardioId(e.id)).flatMap(e=>e.sets).filter(s=>s.done).reduce((a,s)=>a+(s.weight||0),0);
  const isCardioSession=session.exercises.length>0&&session.exercises.every(e=>isCardioId(e.id));

// ─── PROGRESS ─────────────────────────────────────────────────────────────────
const ProgressScreen=({sessions,profile})=>{
  const[metric,setMetric]=useState('volume');
  const prs=useMemo(()=>calcPRs(sessions),[sessions]);
  const weeklyVol=useMemo(()=>calcWeeklyVolume(sessions),[sessions]);
  const stats=useMemo(()=>calcGlobalStats(sessions),[sessions]);

  // Ejercicios de fuerza con datos registrados, ordenados por nº de sesiones
  const trackedExercises=useMemo(()=>{
    const counts={};
    sessions.forEach(s=>(s.exercises||[]).forEach(e=>{
      if(isCardioId(e.id))return;
      if((e.sets||[]).some(st=>st.done&&st.weight>0))counts[e.id]=(counts[e.id]||0)+1;
    }));
    return Object.entries(counts).sort(([,a],[,b])=>b-a).map(([id])=>id);
  },[sessions]);
  const[exId,setExId]=useState(null);
  const selectedEx=exId||trackedExercises[0]||'bench_press';

  const volEntries=Object.entries(weeklyVol).sort(([a],[b])=>a.localeCompare(b)).slice(-12);
  const strengthEntries=sessions.filter(s=>s.exercises.some(e=>e.id===selectedEx)).slice(-12).map(s=>{
    const bp=s.exercises.find(e=>e.id===selectedEx);
    const best=bp?.sets?.filter(st=>st.done&&st.weight>0&&st.reps>0).reduce((a,st)=>Math.max(a,st.weight*(1+st.reps/30)),0)||0;
    return[s.date.slice(0,10),Math.round(best*10)/10];

          <div style={{fontSize:22,fontWeight:700,fontFamily:T.mono,color:T.accent}}>{stats.maxW||0}<span style={{fontSize:12,color:T.textMuted}}> kg</span></div>

// ─── WEEKLY RECAP MODAL ───────────────────────────────────────────────────────
const WeeklyRecap=({profile,goals,nutrition,sessions,apiKey,onClose})=>{
  const[loading,setLoading]=useState(false);
  const[ai,setAi]=useState(null);
  const[err,setErr]=useState(false);
  const week=lastNDates(7).map(d=>nutrition[d]||{date:d,kcal:0,protein:0,sleep:0});
  const avg=k=>{const valid=week.filter(d=>d[k]>0);return valid.length?Math.round(valid.reduce((a,d)=>a+d[k],0)/valid.length):0;};
  const avgKcal=avg('kcal'),avgProt=avg('protein'),avgSleep=Math.round(avg('sleep')*10)/10;
  const weekStart=new Date();weekStart.setDate(weekStart.getDate()-7);
  const wsessions=sessions.filter(s=>new Date(s.date)>=weekStart).length;

  const kcalDiff=avgKcal-goals.kcal;
  const protDiff=avgProt-goals.protein;
  const sleepDiff=avgSleep-7.5;

  const fbCal=avgKcal===0?'Sin datos. Empieza a registrar tus comidas.':Math.abs(kcalDiff)<150?'Estás en tu objetivo de calorías. Mantén la consistencia.':kcalDiff<-150?`Comiste ${Math.abs(kcalDiff)} kcal MENOS de tu objetivo. Si tu meta es ganar masa, añade un snack post-entrenamiento de ~250 kcal.`:`Comiste ${kcalDiff} kcal MÁS de tu objetivo. Si quieres mantener composición, reduce porciones de carbohidratos en cenas.`;
  const fbProt=avgProt===0?'Sin datos de proteína.':protDiff>=-10?'Proteína bien distribuida.':`Te faltan ~${Math.abs(protDiff)}g de proteína al día. Añade 1 ración extra (huevos, pollo, batido o lácteos).`;
  const fbSleep=avgSleep===0?'Sin datos de sueño.':sleepDiff>=-0.5?'Sueño suficiente para recuperación óptima.':sleepDiff<-1.5?`Solo dormiste ${avgSleep}h promedio. CRÍTICO — la testosterona y recuperación caen drásticamente bajo 7h. Acuéstate 1h antes esta semana.`:`Necesitas ~30-60 min más de sueño. Apaga pantallas 30 min antes de dormir.`;

  const generateAI=async()=>{
    setLoading(true);setErr(false);
    const result=await AI.getWeeklyAnalysis(profile,goals,week,wsessions,apiKey);
    if(result){setAi(result);}else{setErr(true);}
    setLoading(false);
  };

  return(
    <div style={{position:'absolute',inset:0,background:T.bg0,zIndex:300,display:'flex',flexDirection:'column',animation:'slideUp .25s ease'}}>
      <div style={{padding:'16px 20px',borderBottom:`1px solid ${T.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase'}}>Análisis semanal</div>
          <div style={{fontSize:16,fontWeight:700,color:T.text,marginTop:2}}>Últimos 7 días</div>
        </div>
        <button onClick={onClose} style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:8,width:34,height:34,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:T.textSub}}><Icon.x/></button>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'16px 20px 24px'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:18}}>

              <span style={{fontSize:16}}>⚡</span>
              <span style={{fontSize:13,fontWeight:700,color:T.accent,fontFamily:T.mono,letterSpacing:'0.05em',textTransform:'uppercase'}}>Análisis Claude IA</span>

// ─── NUTRITION SCREEN ─────────────────────────────────────────────────────────
const NutritionScreen=({profile,sessions,apiKey})=>{
  const sex=S.get(S.SEX,'male');
  const goals=useMemo(()=>calcDailyGoals(profile,sex),[profile,sex]);
  const[nutrition,setNutrition]=useState(()=>S.get(S.NUTRITION,{}));
  const[showRecap,setShowRecap]=useState(false);
  const[foodDesc,setFoodDesc]=useState('');
  const[parsing,setParsing]=useState(false);
  const[parsed,setParsed]=useState(null);
  const[parseErr,setParseErr]=useState(false);
  const[photoPreview,setPhotoPreview]=useState(null);
  const fileRef=useRef(null);
  const today=todayKey();
  const todayLog=nutrition[today]||{date:today,kcal:0,protein:0,sleep:0,sleepQuality:0};

  const update=(field,value)=>{
    const newLog={...todayLog,[field]:value,date:today};
    const newNut={...nutrition,[today]:newLog};
    setNutrition(newNut);S.set(S.NUTRITION,newNut);
  };
  const quickAdd=(kcal,prot)=>{
    setNutrition(n=>{const cur=n[today]||{date:today,kcal:0,protein:0,sleep:0,sleepQuality:0};const updated={...cur,kcal:(cur.kcal||0)+kcal,protein:(cur.protein||0)+prot,date:today};const all={...n,[today]:updated};S.set(S.NUTRITION,all);return all;});
  };

  const parseFood=async()=>{
    if(!foodDesc.trim())return;
    if(!apiKey){setParseErr(true);setTimeout(()=>setParseErr(false),3000);return;}
    setParsing(true);setParseErr(false);
    const result=await AI.parseFoods(foodDesc.trim(),apiKey);
    if(result&&result.kcal){setParsed(result);}else{setParseErr(true);setTimeout(()=>setParseErr(false),3000);}
    setParsing(false);
  };
  const acceptParsed=()=>{
    quickAdd(parsed.kcal,parsed.protein);
    setParsed(null);setFoodDesc('');setPhotoPreview(null);
  };
  const cancelParsed=()=>{
    setParsed(null);setPhotoPreview(null);
  };

  const handlePhoto=async(e)=>{
    const file=e.target.files?.[0];
    e.target.value='';
    if(!file)return;
    if(!apiKey){setParseErr(true);setTimeout(()=>setParseErr(false),3000);return;}
    setParsing(true);setParseErr(false);
    try{
      const{base64,dataUrl}=await imageToBase64(file,1024);
      setPhotoPreview(dataUrl);
      const result=await AI.parseFoodImage(base64,apiKey);
      if(result&&result.kcal){setParsed(result);}else{setParseErr(true);setPhotoPreview(null);setTimeout(()=>setParseErr(false),3000);}
    }catch{setParseErr(true);setPhotoPreview(null);setTimeout(()=>setParseErr(false),3000);}
    setParsing(false);
  };

  const Card=({title,icon,iconColor,current,goal,unit,step,onChange,color=T.accent})=>{
    const pct=Math.min(100,Math.round((current/goal)*100));
    const status=pct<70?'low':pct>110?'over':'good';
    return(
      <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:12,padding:'14px',marginBottom:10}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{color:iconColor}}>{icon}</div>
            <span style={{fontSize:13,color:T.textSub,fontWeight:600}}>{title}</span>
          </div>
          <Badge color={status==='good'?T.green:status==='over'?T.red:T.textMuted}>{status==='good'?'En meta':status==='over'?'Pasado':'Bajo'}</Badge>
        </div>
        <div style={{display:'flex',alignItems:'baseline',gap:6,marginBottom:8}}>
          <span style={{fontSize:28,fontWeight:700,fontFamily:T.mono,color:T.text}}>{current||0}</span>
          <span style={{fontSize:13,color:T.textMuted,fontFamily:T.mono}}>/ {goal} {unit}</span>
        </div>
        <ProgressBar value={current||0} max={goal} color={color} height={6}/>
        <div style={{display:'flex',gap:8,marginTop:12,justifyContent:'center'}}>
          <button onClick={()=>onChange(Math.max(0,(current||0)-step))} style={{flex:1,height:36,borderRadius:8,background:T.bg3,border:`1px solid ${T.border}`,color:T.textSub,fontSize:14,fontWeight:700,fontFamily:T.mono,cursor:'pointer'}}>−{step}</button>
          <button onClick={()=>onChange((current||0)+step)} style={{flex:1,height:36,borderRadius:8,background:color+'18',border:`1px solid ${color}44`,color,fontSize:14,fontWeight:700,fontFamily:T.mono,cursor:'pointer'}}>+{step}</button>
        </div>
      </div>
    );
  };

  return(
    <div style={{height:'100%',overflowY:'auto',background:T.bg0,padding:'18px 20px',position:'relative'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:18}}>
        <div>
          <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase'}}>Hoy</div>
          <h2 style={{fontSize:24,color:T.text,margin:'4px 0 0',fontWeight:700}}>Nutrición</h2>
        </div>
        <button onClick={()=>setShowRecap(true)} style={{background:T.accent+'18',border:`1px solid ${T.accent}44`,borderRadius:10,padding:'8px 12px',color:T.accent,cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:T.font,display:'flex',alignItems:'center',gap:6}}>
          📊 Análisis semanal
        </button>
      </div>

      <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:'10px 14px',marginBottom:14,display:'flex',gap:14}}>
        <div style={{flex:1}}>
          <div style={{fontSize:9,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase'}}>BMR</div>
          <div style={{fontSize:14,fontWeight:700,fontFamily:T.mono,color:T.text}}>{goals.bmr}</div>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:9,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase'}}>TDEE</div>
          <div style={{fontSize:14,fontWeight:700,fontFamily:T.mono,color:T.text}}>{goals.tdee}</div>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:9,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase'}}>Agua</div>
          <div style={{fontSize:14,fontWeight:700,fontFamily:T.mono,color:T.text}}>{goals.water}L</div>
        </div>
      </div>

      <Card title="Calorías" icon={<Icon.flame/>} iconColor={T.accent} current={todayLog.kcal} goal={goals.kcal} unit="kcal" step={50} onChange={v=>update('kcal',v)} color={T.accent}/>

      <Card title="Proteína" icon={<Icon.bolt/>} iconColor={T.green} current={todayLog.protein} goal={goals.protein} unit="g" step={5} onChange={v=>update('protein',v)} color={T.green}/>

      <div style={{background:`linear-gradient(135deg, ${T.accent}15, ${T.accent}05)`,border:`1px solid ${T.accent}44`,borderRadius:12,padding:'14px',marginBottom:14}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <span style={{fontSize:16}}>⚡</span>
          <span style={{fontSize:12,fontWeight:700,color:T.accent,fontFamily:T.mono,letterSpacing:'0.05em',textTransform:'uppercase'}}>Calcula con Claude IA</span>
        </div>
        <div style={{fontSize:11,color:T.textSub,marginBottom:10,lineHeight:1.5}}>Toma una foto del plato o describe lo que comiste — Claude estima calorías y proteína.</div>
        <input type="file" accept="image/*" capture="environment" ref={fileRef} onChange={handlePhoto} style={{display:'none'}}/>
        <button onClick={()=>fileRef.current?.click()} disabled={parsing} style={{width:'100%',marginBottom:10,padding:'12px',borderRadius:10,background:T.accent,color:T.bg0,border:'none',cursor:parsing?'wait':'pointer',fontSize:14,fontWeight:700,fontFamily:T.font,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          📸 Tomar foto del plato
        </button>
        {photoPreview&&(
          <div style={{marginBottom:10,position:'relative',borderRadius:8,overflow:'hidden',border:`1px solid ${T.border}`}}>
            <img src={photoPreview} alt="Foto del plato" style={{width:'100%',display:'block',maxHeight:180,objectFit:'cover'}}/>
            {parsing&&<div style={{position:'absolute',inset:0,background:T.bg0+'cc',display:'flex',alignItems:'center',justifyContent:'center',gap:8,color:T.accent,fontSize:12,fontWeight:700,fontFamily:T.mono}}>
              <div style={{width:14,height:14,borderRadius:'50%',border:`2px solid ${T.accent}`,borderTopColor:'transparent',animation:'spin 1s linear infinite'}}/>
              Analizando foto...
            </div>}
          </div>
        )}
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <div style={{flex:1,height:1,background:T.border}}/>
          <span style={{fontSize:10,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase'}}>o describe</span>
          <div style={{flex:1,height:1,background:T.border}}/>
        </div>
        <textarea
          value={foodDesc}
          onChange={e=>setFoodDesc(e.target.value)}
          placeholder="ej: 3 huevos revueltos, tostada integral con aguacate, café con leche"
          rows={2}
          style={{width:'100%',background:T.bg2,border:`1px solid ${T.border}`,borderRadius:8,padding:'10px 12px',color:T.text,fontSize:13,fontFamily:T.font,outline:'none',resize:'vertical',minHeight:54,boxSizing:'border-box'}}
          onFocus={e=>e.target.style.borderColor=T.accent}
          onBlur={e=>e.target.style.borderColor=T.border}
        />
        <button onClick={parseFood} disabled={parsing||!foodDesc.trim()} style={{width:'100%',marginTop:8,padding:'11px',borderRadius:8,background:parseErr?T.red+'20':parsing||!foodDesc.trim()?T.bg3:T.accent,color:parseErr?T.red:parsing||!foodDesc.trim()?T.textMuted:T.bg0,border:parseErr?`1px solid ${T.red}44`:'none',cursor:parsing||!foodDesc.trim()?'not-allowed':'pointer',fontSize:13,fontWeight:700,fontFamily:T.font,display:'flex',alignItems:'center',justifyContent:'center',gap:8,transition:'all .2s'}}>
          {parsing?(<><div style={{width:13,height:13,borderRadius:'50%',border:`2px solid ${T.bg0}`,borderTopColor:'transparent',animation:'spin 1s linear infinite'}}/>Analizando...</>):parseErr?(!apiKey?'Necesitas API Key (en Perfil)':'Error — reintenta'):'⚡ Calcular calorías'}
        </button>
      </div>

      {parsed&&(
        <div style={{background:T.bg2,border:`1px solid ${T.accent}66`,borderRadius:12,padding:'14px',marginBottom:14,animation:'slideUp .25s ease'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:12,fontWeight:700,color:T.accent,fontFamily:T.mono,textTransform:'uppercase'}}>Estimación IA</span>
            <Badge color={parsed.confidence==='alta'?T.green:parsed.confidence==='baja'?T.red:T.blue}>{parsed.confidence}</Badge>
          </div>
          <div style={{display:'flex',gap:14,marginBottom:12}}>
            <div style={{flex:1,background:T.bg3,borderRadius:8,padding:'10px 12px',textAlign:'center'}}>
              <div style={{fontSize:9,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase'}}>Calorías</div>
              <div style={{fontSize:22,fontWeight:700,fontFamily:T.mono,color:T.accent,marginTop:2}}>{parsed.kcal}</div>
            </div>
            <div style={{flex:1,background:T.bg3,borderRadius:8,padding:'10px 12px',textAlign:'center'}}>
              <div style={{fontSize:9,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase'}}>Proteína</div>
              <div style={{fontSize:22,fontWeight:700,fontFamily:T.mono,color:T.green,marginTop:2}}>{parsed.protein}g</div>
            </div>
          </div>
          {parsed.items&&parsed.items.length>0&&(
            <div style={{marginBottom:12}}>
              <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase',marginBottom:6}}>Desglose</div>
              {parsed.items.map((it,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:i<parsed.items.length-1?`1px solid ${T.border}`:'none'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,color:T.text,fontWeight:500}}>{it.name}</div>
                    <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono}}>{it.amount}</div>
                  </div>
                  <div style={{fontSize:11,color:T.textSub,fontFamily:T.mono,textAlign:'right'}}>{it.kcal} kcal · {it.protein}g</div>
                </div>
              ))}
            </div>
          )}
          {parsed.notes&&<div style={{fontSize:11,color:T.textMuted,fontStyle:'italic',marginBottom:12,lineHeight:1.5}}>💡 {parsed.notes}</div>}
          <div style={{display:'flex',gap:8}}>
            <button onClick={cancelParsed} style={{flex:1,padding:'10px',borderRadius:8,background:T.bg3,border:`1px solid ${T.border}`,color:T.textSub,cursor:'pointer',fontSize:12,fontWeight:600,fontFamily:T.font}}>Cancelar</button>
            <button onClick={acceptParsed} style={{flex:2,padding:'10px',borderRadius:8,background:T.green,border:'none',color:T.bg0,cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:T.font}}>✓ Añadir a hoy</button>
          </div>
        </div>
      )}

      <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8,marginTop:8}}>Atajos rápidos</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:14}}>
        {[{l:'Snack',k:200,p:15},{l:'Comida ligera',k:400,p:25},{l:'Comida principal',k:650,p:40},{l:'Batido proteico',k:180,p:30}].map((q,i)=>(
          <button key={i} onClick={()=>quickAdd(q.k,q.p)} style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:'10px',cursor:'pointer',textAlign:'left'}}>
            <div style={{fontSize:12,color:T.text,fontWeight:600}}>+ {q.l}</div>
            <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono,marginTop:2}}>{q.k} kcal · {q.p}g prot</div>
          </button>
        ))}
      </div>

      <Card title="Sueño anoche" icon={<Icon.moon/>} iconColor={T.blue} current={todayLog.sleep} goal={8} unit="h" step={0.5} onChange={v=>update('sleep',Math.round(v*2)/2)} color={T.blue}/>

      <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:'12px 14px',marginBottom:10}}>
        <div style={{fontSize:11,color:T.textMuted,fontFamily:T.mono,textTransform:'uppercase',marginBottom:8}}>Calidad del sueño</div>
        <div style={{display:'flex',gap:6}}>
          {[1,2,3,4,5].map(n=>(
            <button key={n} onClick={()=>update('sleepQuality',n)} style={{flex:1,height:38,borderRadius:8,background:todayLog.sleepQuality>=n?T.blue+'30':T.bg3,border:`1px solid ${todayLog.sleepQuality>=n?T.blue:T.border}`,color:todayLog.sleepQuality>=n?T.blue:T.textMuted,fontSize:18,cursor:'pointer'}}>★</button>
          ))}
        </div>
      </div>

      <button onClick={()=>setShowRecap(true)} style={{width:'100%',padding:'14px',borderRadius:12,background:T.accent,color:T.bg0,border:'none',fontSize:14,fontWeight:700,fontFamily:T.font,cursor:'pointer',marginTop:8,marginBottom:20,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
        📊 Ver análisis semanal completo
      </button>

      {showRecap&&<WeeklyRecap profile={profile} goals={goals} nutrition={nutrition} sessions={sessions} apiKey={apiKey} onClose={()=>setShowRecap(false)}/>}
    </div>
  );
};

// ─── STATUS BAR ───────────────────────────────────────────────────────────────
const StatusBar=()=>{
  const[time,setTime]=useState(()=>{const d=new Date();return`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;});
  useEffect(()=>{const t=setInterval(()=>{const d=new Date();setTime(`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`);},10000);return()=>clearInterval(t);},[]);
  return(
    <div style={{height:48,display:'flex',alignItems:'flex-end',justifyContent:'space-between',padding:'0 26px 7px',flexShrink:0,position:'relative',zIndex:10}}>
      <div style={{position:'absolute',top:10,left:'50%',transform:'translateX(-50%)',width:118,height:32,borderRadius:18,background:'#000'}}/>
      <span style={{fontSize:14,fontWeight:700,color:T.text,fontFamily:T.mono,zIndex:1}}>{time}</span>
      <div style={{display:'flex',gap:5,alignItems:'center',zIndex:1}}>
        <svg width="17" height="12" viewBox="0 0 17 12" fill={T.text}><rect x="0" y="7" width="3" height="5" rx="1" opacity="0.4"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="1" opacity="0.6"/><rect x="9" y="2" width="3" height="10" rx="1" opacity="0.8"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke={T.text} strokeWidth="1.4" strokeLinecap="round"><path d="M1 4C3.2 1.7 11.8 1.7 14 4" opacity="0.4"/><path d="M3 6.5C4.3 5.1 10.7 5.1 12 6.5" opacity="0.7"/><path d="M5.5 9C6.2 8.1 8.8 8.1 9.5 9"/><circle cx="7.5" cy="10.5" r=".8" fill={T.text} stroke="none"/></svg>
        <div style={{display:'flex',alignItems:'center',gap:1}}>
          <div style={{width:22,height:11,borderRadius:3,border:`1px solid rgba(240,237,232,.5)`,padding:1.5,display:'flex',alignItems:'center'}}>
            <div style={{width:'80%',height:'100%',background:T.text,borderRadius:1}}/>
          </div>
          <div style={{width:2,height:5,background:'rgba(240,237,232,.5)',borderRadius:1}}/>
        </div>
      </div>
    </div>
  );
};

// ─── RESUME BANNER ────────────────────────────────────────────────────────────
const ResumeBanner=({active,onContinue,onDiscard})=>{
  const mins=Math.floor((Date.now()-active.startTime)/60000);
  const done=(active.sets||[]).flat().filter(s=>s.done).length;
  const total=(active.sets||[]).flat().length;
  return(
    <div style={{position:'absolute',top:0,left:0,right:0,zIndex:90,padding:'12px 14px',background:T.accent+'18',border:`1px solid ${T.accent}66`,borderTop:'none',borderLeft:'none',borderRight:'none',display:'flex',alignItems:'center',gap:10,animation:'slideUp .25s ease'}}>
      <div style={{fontSize:20}}>🏋️</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:12,fontWeight:700,color:T.text,marginBottom:1}}>Entrenamiento en curso</div>
        <div style={{fontSize:10,color:T.textMuted,fontFamily:T.mono}}>{active.workout?.label||''} · hace {mins} min · {done}/{total} sets</div>
      </div>
      <button onClick={onDiscard} style={{background:'none',border:`1px solid ${T.border}`,borderRadius:8,padding:'6px 10px',color:T.textMuted,cursor:'pointer',fontSize:11,fontFamily:T.font}}>Descartar</button>
      <button onClick={onContinue} style={{background:T.accent,border:'none',borderRadius:8,padding:'6px 12px',color:T.bg0,cursor:'pointer',fontSize:11,fontWeight:700,fontFamily:T.font}}>Continuar</button>
    </div>
  );
};

// ─── APP ──────────────────────────────────────────────────────────────────────
const App=()=>{
  const[screen,setScreen]=useState('loading');
  const[tab,setTab]=useState('dashboard');
  const[profile,setProfile]=useState(null);
  const[plan,setPlan]=useState(null);
  const[sessions,setSessions]=useState([]);
  const[apiKey,setApiKey]=useState('');
  const[activeWorkout,setActiveWorkout]=useState(null);
  const[savedActive,setSavedActive]=useState(null);
  const[lastSession,setLastSession]=useState(null);

  useEffect(()=>{
    const p=S.get(S.PROFILE);
    const pl=S.get(S.PLAN);
    const sess=S.get(S.SESSIONS,[]);
    const key=S.get(S.APIKEY,'');
    const active=cleanStaleActive();
    setApiKey(key||'');
    setSessions(sess||[]);
    if(active&&active.workout&&active.startTime){setSavedActive(active);}
    if(p&&pl){setProfile(p);setPlan(pl);setScreen('main');}
    else{setScreen('onboarding');}
  },[]);

  const continueActive=()=>{
    if(!savedActive)return;
    setActiveWorkout(savedActive.workout);
    setScreen('workout');
  };
  const discardActive=()=>{
    S.set(S.ACTIVE,null);
    setSavedActive(null);
  };

  const handleOnboardingComplete=(form,generatedPlan)=>{
    S.set(S.PROFILE,form);S.set(S.PLAN,generatedPlan);
    setProfile(form);setPlan(generatedPlan);setScreen('main');
  };

  const handleUpdateApiKey=(key)=>{
    S.set(S.APIKEY,key);setApiKey(key);
  };

  const handleStartWorkout=(workoutDay)=>{
    // Si había uno activo previo, lo descartamos al empezar uno nuevo
    if(savedActive){S.set(S.ACTIVE,null);setSavedActive(null);}
    setActiveWorkout(workoutDay);setScreen('workout');
  };

  const handleFinishWorkout=(sessionData)=>{
    const session={...sessionData,id:Date.now(),date:new Date().toISOString()};
    const newSessions=[...sessions,session];
    setSessions(newSessions);S.set(S.SESSIONS,newSessions);
    S.set(S.ACTIVE,null);setSavedActive(null);
    setLastSession(session);setActiveWorkout(null);setScreen('done');
  };

  const handleReset=()=>{
    localStorage.clear();setProfile(null);setPlan(null);setSessions([]);setApiKey('');setScreen('onboarding');
  };

  const handleUpdatePlan=(newPlan)=>{
    S.set(S.PLAN,newPlan);setPlan(newPlan);
  };

  const navigate=(t)=>{setTab(t);};

  if(screen==='loading')return(
    <div style={{width:'100%',height:'100%',background:T.bg0,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{width:40,height:40,borderRadius:'50%',border:`2px solid ${T.border}`,borderTopColor:T.accent,animation:'spin 1s linear infinite'}}/>
    </div>
  );

  const renderContent=()=>{
    if(screen==='workout'&&activeWorkout)return<WorkoutScreen workout={activeWorkout} profile={profile} apiKey={apiKey} sessions={sessions} onFinish={handleFinishWorkout} savedState={savedActive}/>;
    if(screen==='done'&&lastSession)return<WorkoutDoneScreen session={lastSession} onClose={()=>{setScreen('main');setTab('dashboard');}}/>;
    if(tab==='dashboard')return<DashboardScreen profile={profile} plan={plan} sessions={sessions} onStartWorkout={handleStartWorkout} onUpdatePlan={handleUpdatePlan}/>;
    if(tab==='progress')return<ProgressScreen sessions={sessions} profile={profile}/>;
    if(tab==='nutrition')return<NutritionScreen profile={profile} sessions={sessions} apiKey={apiKey}/>;
    if(tab==='profile')return<ProfileScreen profile={profile} apiKey={apiKey} onUpdateApiKey={handleUpdateApiKey} onReset={handleReset}/>;
  };

  return(
    <div style={{width:'100%',height:'100%',background:T.bg0,position:'relative',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {screen==='onboarding'?(
        <OnboardingScreen onComplete={handleOnboardingComplete}/>
      ):(
        <>
          <div style={{flex:1,overflow:'hidden',position:'relative'}}>
            {savedActive&&screen==='main'&&tab==='dashboard'&&<ResumeBanner active={savedActive} onContinue={continueActive} onDiscard={discardActive}/>}
            {renderContent()}
          </div>
          {screen!=='workout'&&screen!=='done'&&<BottomNav current={tab} onChange={navigate}/>}
        </>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
